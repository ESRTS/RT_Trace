[general]
# Path where the application can find ps2pdf utility
ps2pdf_path = /usr/local/bin
project_path = /Users/mabecker/Documents/Code/ES-Lab-Kit/Software/Projects

[Pico2_FreeRTOS_SRAM]
# Path where the application can find openocd
openocd_path = /Users/mabecker/.pico-sdk/openocd/0.12.0+dev
# Address of the trace buffers on the target
buffer0 = 0x2008001c
buffer1 = 0x2008100c
# Length of the trace buffers (each), in byte
bufferSize = 2000
# ISR ID for the scheduling tick on each core
tickId = 15,42

[Pico2_FreeRTOS_PSRAM]
# Path where the application can find openocd
openocd_path = /Users/mabecker/.pico-sdk/openocd/0.12.0+dev
# Address of the trace buffers on the target
buffer0 = 0x15000000
buffer1 = 0x15004E20
# Length of the trace buffers (each), in byte
bufferSize = 20000
#2000000
# ISR ID for the scheduling tick on each core
tickId = 15,42

[Pico2_FreeRTOS_RTT]
# For RTT trace collection, the elf-file is needed. Before tracing, the elf-file is written to the target
elf = /Users/mabecker/Documents/Code/ES-Lab-Kit/Software/Projects/JLD_Versions/build/JLD_Versions.elf
# Optional specification of debug probe to use
#probe
# Target platform. Default, if not specified, is rp2350
target = rp2350
# SWD frequency
frequency = 4_000_000
# Duration of the trace collection. The target is halted afterwards
measure_seconds = 5
# ISR ID for the scheduling tick on each core
tickId = 15,42

