[general]
# Path to the project folder. Absolute, or relative to the RT_Trace folder.
# Set a different folder in config.local.ini (see config.local.ini.example).
project_path = ../../Software/Projects

# Size of the user interface. auto follows the desktop scaling, or set a factor such as 1.5
ui_scale = auto

# Target platform. Default, if not specified, is rp2350
target = rp2350
# SWD frequency
frequency = 4_000_000
# Duration of the trace collection in seconds. The target is halted afterwards
measure_seconds = 2
# ISR ID for the FreeRTOS tick ISR on each core
# Note that for IRQ id's in the NVIC add 16 to the IRQ number
# 15 -> SysTick 
# 16 -> 0 -> TIMER0
# 42 -> 26 -> IRQ_BELL
# 45 -> 29 -> MTIMECMP
# 41 -> 25 -> HW_FIFO
tickId = 15,16,42,45,41
irqName = SysTick,Tick,Bell,Timer,FIFO
# Print a hexdump of each raw trace buffer to the output box when loading a trace (for debugging)
print_hexdump = False
# Print every event read from the trace buffers to the output box. They are always written to events.txt
print_events = False
#tickId = 15,42,45

[Pico2_FreeRTOS_SRAM]
# Address of the trace buffers on the target
buffer0 = 0x2008001c
buffer1 = 0x2008100c
# Length of the trace buffers (each), in byte
bufferSize = 2000

[Pico2_FreeRTOS_PSRAM]
# Address of the trace buffers on the target
buffer0 = 0x15000000
buffer1 = 0x15004E20
# Length of the trace buffers (each), in byte
bufferSize = 20000

[RPI_Linux]
# !!!Linux tracing is experimental!!!
# Set target, target_path and recorderBase_path in config.local.ini.
# user@targetAddress
target =
# Full path to the application to be traced
target_path =
# Base path where the recorder files are located
recorderBase_path =
# Name of the trace application on the target
recorder_filename = traceApp.py
# Name of the generated trace file
trace_filename = trace.txt
# Consider user-events when parsing the task execution
user_events = True